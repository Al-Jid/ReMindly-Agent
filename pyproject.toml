[project]
name = "remindly-agent"
version = "1.0.0"
description = "AI-powered Markdown notes organizer"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.141.1",
    "openai==3.0.0",
    "python-dotenv==1.2.2",
    "slowapi==0.1.10",
    "uvicorn==0.52.1",
]


[tool.black]
line-length = 88
target-version = ["py312"]


[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

exclude = [
    ".venv",
]


[[tool.mypy.overrides]]
module = [
    "slowapi.*",
]

ignore_missing_imports = true
